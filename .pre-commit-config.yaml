repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src/"]
        additional_dependencies: [toml]

  - repo: https://github.com/python-mypy/mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--config-file, pyproject.toml]
        additional_dependencies: []

  - repo: local
    hooks:
      - id: semgrep
        name: semgrep
        entry: semgrep --config=auto --error --quiet --config p/semgrep-cli
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies: [semgrep]
