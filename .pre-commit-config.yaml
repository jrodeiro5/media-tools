repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: [toml]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy --config-file pyproject.toml
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: semgrep
        name: semgrep
        entry: semgrep --config=auto --error --quiet
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies: [semgrep]

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (scan staged changes for secrets)
        entry: gitleaks protect --staged --verbose
        language: system
