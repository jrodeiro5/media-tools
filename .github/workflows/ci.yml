name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        run: uv sync --group dev --python 3.11

      - name: Run pre-commit
        # gitleaks needs the binary and staged changes; secrets are covered by GitHub secret scanning
        run: SKIP=gitleaks uvx pre-commit run --all-files
