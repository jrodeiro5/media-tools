<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" role="img" aria-label="Terminal demo: merging and compressing PDFs with media-tools, then starting the MCP server">
<title>media-tools in a terminal</title>
<style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.p{fill:#ffb02e}.c{fill:#eceef3}.o{fill:#8b93a7}.k{fill:#6ee7a8}.dot{opacity:.9}@keyframes t0{0%,4.286%{width:0}20.0%,92.857%{width:445.2px}93.571%,100%{width:0}}#r0{animation:t0 14.0s steps(53) infinite}@keyframes o1{0%,22.857%{opacity:0}23.929%,92.857%{opacity:1}93.571%,100%{opacity:0}}.q1{animation:o1 14.0s linear infinite}@keyframes t2{0%,32.857%{width:0}48.571%,92.857%{width:453.6px}93.571%,100%{width:0}}#r2{animation:t2 14.0s steps(54) infinite}@keyframes o3{0%,51.429%{opacity:0}52.5%,92.857%{opacity:1}93.571%,100%{opacity:0}}.q3{animation:o3 14.0s linear infinite}@keyframes t4{0%,61.429%{width:0}68.571%,92.857%{width:151.2px}93.571%,100%{width:0}}#r4{animation:t4 14.0s steps(18) infinite}@keyframes o5{0%,71.429%{opacity:0}72.5%,92.857%{opacity:1}93.571%,100%{opacity:0}}.q5{animation:o5 14.0s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><clipPath id="k0"><rect id="r0" x="44.8" y="60" width="445.2" height="22"/></clipPath><clipPath id="k2"><rect id="r2" x="44.8" y="128" width="453.6" height="22"/></clipPath><clipPath id="k4"><rect id="r4" x="44.8" y="196" width="151.2" height="22"/></clipPath></defs>
<rect width="720" height="272" rx="12" fill="#12141a"/>
<rect x="0" y="0" width="720" height="40" rx="12" fill="#1b1e27"/><rect x="0" y="28" width="720" height="12" fill="#1b1e27"/>
<circle class="dot" cx="24" cy="20" r="6" fill="#ff5f57"/><circle class="dot" cx="44" cy="20" r="6" fill="#febc2e"/><circle class="dot" cx="64" cy="20" r="6" fill="#28c840"/>
<text x="360" y="25" text-anchor="middle" class="o" style="font-size:12px">media-tools</text>
<text x="28" y="76" class="p">$</text><text x="44.8" y="76" class="c" textLength="445.2" lengthAdjust="spacing" clip-path="url(#k0)">media-tools pdf merge a.pdf b.pdf --output merged.pdf</text><text x="28" y="102" class="k q1" textLength="369.6" lengthAdjust="spacing">{"result": "Merged 2 files into merged.pdf"}</text><text x="28" y="144" class="p">$</text><text x="44.8" y="144" class="c" textLength="453.6" lengthAdjust="spacing" clip-path="url(#k2)">media-tools pdf compress merged.pdf --output small.pdf</text><text x="28" y="170" class="k q3" textLength="310.8" lengthAdjust="spacing">{"result": "Compressed to small.pdf"}</text><text x="28" y="212" class="p">$</text><text x="44.8" y="212" class="c" textLength="151.2" lengthAdjust="spacing" clip-path="url(#k4)">media-tools-server</text><text x="28" y="238" class="o q5" textLength="420.0" lengthAdjust="spacing">INFO:&#160;&#160;&#160;&#160;&#160;Uvicorn running on http://127.0.0.1:8020</text>
</svg>